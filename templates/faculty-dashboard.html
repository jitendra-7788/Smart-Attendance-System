<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Smart Attendance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="faculty-dashboard.html">
                <i class="bi bi-calendar-check me-2"></i>Smart Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="faculty-dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h2 class="text-white fw-bold">
                        <i class="bi bi-speedometer2 me-2"></i>Faculty Dashboard
                    </h2>
                    <p class="text-white-50">Welcome back, <span id="facultyName"></span>!</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <div class="card-body">
                            <h3 id="totalSessions">0</h3>
                            <p>Total Sessions</p>
                            <i class="bi bi-calendar-event"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                        <div class="card-body">
                            <h3 id="totalStudents">0</h3>
                            <p>Registered Students</p>
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <a href="register-student.html" class="text-decoration-none">
                        <div class="card stat-card"
                            style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                            <div class="card-body">
                                <h3><i class="bi bi-plus-circle"></i></h3>
                                <p>Register Student</p>
                                <i class="bi bi-person-plus"></i>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="generate-otp.html" class="text-decoration-none">
                        <div class="card stat-card"
                            style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="card-body">
                                <h3><i class="bi bi-key"></i></h3>
                                <p>Generate OTP</p>
                                <i class="bi bi-shield-lock"></i>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Recent Sessions -->
            <div class="row">
                <div class="col-12">
                    <div class="card fade-in">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-calendar-event me-2"></i>Your Sessions
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <button class="btn btn-primary" data-bs-toggle="modal"
                                    data-bs-target="#createSessionModal">
                                    <i class="bi bi-plus-circle me-2"></i>Create New Session
                                </button>
                            </div>
                            <div id="sessionsContainer">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Session Modal -->
    <div class="modal fade" id="createSessionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Session</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalAlertContainer"></div>
                    <form id="createSessionForm">
                        <div class="mb-3">
                            <label for="courseName" class="form-label">Course Name *</label>
                            <input type="text" class="form-control" id="courseName" required>
                        </div>
                        <div class="mb-3">
                            <label for="sessionDate" class="form-label">Date *</label>
                            <input type="date" class="form-control" id="sessionDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="sessionTime" class="form-label">Time *</label>
                            <input type="time" class="form-control" id="sessionTime" required>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="otpEnabled" checked>
                                <label class="form-check-label" for="otpEnabled">
                                    Enable OTP for this session
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="createSessionBtn">
                        <i class="bi bi-plus-circle me-2"></i>Create Session
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/auth.js"></script>
    <script>
        let sessions = [];

        async function loadDashboard() {
            const user = getUser();
            const profile = getProfile();

            if (user) {
                document.getElementById('facultyName').textContent = user.first_name || user.username;
            }

            await loadSessions();
        }

        async function loadSessions() {
            try {
                const response = await apiRequest('/sessions/');
                const data = await response.json();

                if (response.ok) {
                    sessions = data;
                    document.getElementById('totalSessions').textContent = sessions.length;
                    displaySessions(sessions);
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
                document.getElementById('sessionsContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>Failed to load sessions
                    </div>
                `;
            }
        }

        function displaySessions(sessions) {
            const container = document.getElementById('sessionsContainer');

            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-calendar-x" style="font-size: 3rem;"></i>
                        <p class="mt-3">No sessions created yet. Create your first session!</p>
                    </div>
                `;
                return;
            }

            const table = `
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Course Name</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>OTP Enabled</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sessions.map(session => `
                                <tr>
                                    <td><strong>${session.course_name}</strong></td>
                                    <td>${new Date(session.session_date).toLocaleDateString()}</td>
                                    <td>${session.session_time}</td>
                                    <td>
                                        ${session.otp_enabled ?
                    '<span class="badge bg-success">Yes</span>' :
                    '<span class="badge bg-secondary">No</span>'}
                                    </td>
                                    <td>
                                        <a href="view-attendance.html?session=${session.id}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye me-1"></i>View Attendance
                                        </a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = table;
        }

        document.getElementById('createSessionBtn').addEventListener('click', async function () {
            const courseName = document.getElementById('courseName').value;
            const sessionDate = document.getElementById('sessionDate').value;
            const sessionTime = document.getElementById('sessionTime').value;
            const otpEnabled = document.getElementById('otpEnabled').checked;

            if (!courseName || !sessionDate || !sessionTime) {
                showAlert('modalAlertContainer', 'Please fill in all required fields', 'danger');
                return;
            }

            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';

            try {
                const response = await apiRequest('/sessions/', {
                    method: 'POST',
                    body: JSON.stringify({
                        course_name: courseName,
                        session_date: sessionDate,
                        session_time: sessionTime,
                        otp_enabled: otpEnabled
                    })
                });

                if (response.ok) {
                    showAlert('modalAlertContainer', 'Session created successfully!', 'success');
                    document.getElementById('createSessionForm').reset();

                    setTimeout(() => {
                        bootstrap.Modal.getInstance(document.getElementById('createSessionModal')).hide();
                        loadSessions();
                    }, 1000);
                } else {
                    const data = await response.json();
                    showAlert('modalAlertContainer', 'Failed to create session', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('modalAlertContainer', 'An error occurred', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-plus-circle me-2"></i>Create Session';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>

</html>
