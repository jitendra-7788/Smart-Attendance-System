<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Smart Attendance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="student-dashboard.html">
                <i class="bi bi-calendar-check me-2"></i>Smart Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="student-dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h2 class="text-white fw-bold">
                        <i class="bi bi-speedometer2 me-2"></i>Student Dashboard
                    </h2>
                    <p class="text-white-50">Welcome, <span id="studentName"></span>!</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <div class="card-body">
                            <h3 id="totalAttendance">0</h3>
                            <p>Total Attendance</p>
                            <i class="bi bi-check-circle"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <a href="mark-attendance.html" class="text-decoration-none">
                        <div class="card stat-card"
                            style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                            <div class="card-body">
                                <h3><i class="bi bi-plus-circle"></i></h3>
                                <p>Mark Attendance</p>
                                <i class="bi bi-calendar-check"></i>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="attendance-history.html" class="text-decoration-none">
                        <div class="card stat-card"
                            style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                            <div class="card-body">
                                <h3><i class="bi bi-clock-history"></i></h3>
                                <p>View History</p>
                                <i class="bi bi-list-ul"></i>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Recent Attendance -->
            <div class="row">
                <div class="col-12">
                    <div class="card fade-in">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-clock-history me-2"></i>Recent Attendance
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="attendanceContainer">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/auth.js"></script>
    <script>
        async function loadDashboard() {
            const user = getUser();
            const profile = getProfile();

            if (profile) {
                document.getElementById('studentName').textContent = profile.full_name || user.username;
            }

            await loadAttendance();
        }

        async function loadAttendance() {
            try {
                const response = await apiRequest('/attendance/history/');
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('totalAttendance').textContent = data.length;
                    displayAttendance(data.slice(0, 5)); // Show last 5
                }
            } catch (error) {
                console.error('Error loading attendance:', error);
                document.getElementById('attendanceContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>Failed to load attendance
                    </div>
                `;
            }
        }

        function displayAttendance(attendance) {
            const container = document.getElementById('attendanceContainer');

            if (attendance.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-calendar-x" style="font-size: 3rem;"></i>
                        <p class="mt-3">No attendance records yet. Mark your first attendance!</p>
                    </div>
                `;
                return;
            }

            const table = `
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Course</th>
                                <th>Date</th>
                                <th>Marked At</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${attendance.map(record => `
                                <tr>
                                    <td><strong>${record.course_name}</strong></td>
                                    <td>${new Date(record.session_date).toLocaleDateString()}</td>
                                    <td>${new Date(record.marked_at).toLocaleString()}</td>
                                    <td>
                                        ${record.verified ?
                    '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Verified</span>' :
                    '<span class="badge bg-warning"><i class="bi bi-clock me-1"></i>Pending</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = table;
        }

        document.getElementById('logoutBtn').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>

</html>
