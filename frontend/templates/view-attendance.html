<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance - Smart Attendance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="faculty-dashboard.html">
                <i class="bi bi-calendar-check me-2"></i>Smart Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="faculty-dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h2 class="text-white fw-bold">
                        <i class="bi bi-eye me-2"></i>Session Attendance
                    </h2>
                    <p class="text-white-50" id="sessionInfo">Loading session details...</p>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="card fade-in">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-people me-2"></i>Attendance List
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="attendanceContainer">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');

        async function loadAttendance() {
            if (!sessionId) {
                document.getElementById('attendanceContainer').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle me-2"></i>No session selected
                    </div>
                `;
                return;
            }

            try {
                const response = await apiRequest(`/attendance/session/${sessionId}/`);
                const data = await response.json();

                if (response.ok) {
                    displayAttendance(data);
                }
            } catch (error) {
                console.error('Error loading attendance:', error);
                document.getElementById('attendanceContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>Failed to load attendance
                    </div>
                `;
            }
        }

        function displayAttendance(attendance) {
            const container = document.getElementById('attendanceContainer');

            if (attendance.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-person-x" style="font-size: 4rem;"></i>
                        <h4 class="mt-3">No Attendance Marked</h4>
                        <p>No students have marked attendance for this session yet.</p>
                    </div>
                `;
                return;
            }

            // Update session info
            if (attendance.length > 0) {
                document.getElementById('sessionInfo').textContent =
                    `${attendance[0].course_name} - ${new Date(attendance[0].session_date).toLocaleDateString()}`;
            }

            const table = `
                <div class="mb-3">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Total Students Present: <span class="badge bg-success">${attendance.length}</span></h6>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>Roll Number</th>
                                <th>Marked At</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${attendance.map((record, index) => `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td><strong>${record.student_name}</strong></td>
                                    <td>${record.roll_number}</td>
                                    <td>${new Date(record.marked_at).toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            })}</td>
                                    <td>
                                        ${record.verified ?
                    '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Verified</span>' :
                    '<span class="badge bg-warning text-dark"><i class="bi bi-clock me-1"></i>Pending</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = table;
        }

        document.getElementById('logoutBtn').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        document.addEventListener('DOMContentLoaded', loadAttendance);
    </script>
</body>

</html>
