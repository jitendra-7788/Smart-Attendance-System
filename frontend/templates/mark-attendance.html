<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Smart Attendance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="student-dashboard.html">
                <i class="bi bi-calendar-check me-2"></i>Smart Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="student-dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card fade-in">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-calendar-check me-2"></i>Mark Your Attendance
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="alertContainer"></div>

                            <form id="markAttendanceForm">
                                <div class="mb-3">
                                    <label for="sessionSelect" class="form-label">Select Session *</label>
                                    <select class="form-select" id="sessionSelect" required>
                                        <option value="">Loading sessions...</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="otpCode" class="form-label">
                                        <i class="bi bi-key me-1"></i>Enter OTP Code *
                                    </label>
                                    <input type="text" class="form-control form-control-lg text-center" id="otpCode"
                                        maxlength="6" pattern="[0-9]{6}" placeholder="000000" required
                                        style="font-size: 2rem; letter-spacing: 0.5rem;">
                                    <small class="text-muted">Enter the 6-digit OTP provided by your faculty</small>
                                </div>

                                <div class="alert alert-info">
                                    <i class="bi bi-info-circle me-2"></i>
                                    <strong>Note:</strong> OTP is valid for 30 seconds only. Make sure to enter it
                                    quickly!
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-lg" id="markAttendanceBtn">
                                        <i class="bi bi-check-circle me-2"></i>Mark Attendance
                                    </button>
                                    <a href="student-dashboard.html" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/auth.js"></script>
    <script>
        async function loadSessions() {
            try {
                const response = await apiRequest('/sessions/');
                const data = await response.json();

                if (response.ok) {
                    const select = document.getElementById('sessionSelect');

                    if (data.length === 0) {
                        select.innerHTML = '<option value="">No sessions available</option>';
                    } else {
                        // Filter today's sessions
                        const today = new Date().toISOString().split('T')[0];
                        const todaySessions = data.filter(s => s.session_date === today);

                        if (todaySessions.length === 0) {
                            select.innerHTML = '<option value="">No sessions available for today</option>';
                        } else {
                            select.innerHTML = '<option value="">Select a session...</option>' +
                                todaySessions.map(s => `
                                    <option value="${s.id}">
                                        ${s.course_name} - ${s.session_time}
                                    </option>
                                `).join('');
                        }
                    }
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }

        document.getElementById('markAttendanceForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const sessionId = document.getElementById('sessionSelect').value;
            const otpCode = document.getElementById('otpCode').value;

            if (!sessionId) {
                showAlert('alertContainer', 'Please select a session', 'warning');
                return;
            }

            if (otpCode.length !== 6) {
                showAlert('alertContainer', 'OTP must be 6 digits', 'warning');
                return;
            }

            const btn = document.getElementById('markAttendanceBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Marking...';

            try {
                const response = await apiRequest('/attendance/mark/', {
                    method: 'POST',
                    body: JSON.stringify({
                        session_id: parseInt(sessionId),
                        otp_code: otpCode
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    showAlert('alertContainer',
                        '<i class="bi bi-check-circle me-2"></i>Attendance marked successfully!',
                        'success');

                    document.getElementById('markAttendanceForm').reset();

                    setTimeout(() => {
                        window.location.href = 'student-dashboard.html';
                    }, 2000);
                } else {
                    let errorMsg = 'Failed to mark attendance';
                    try {
                        const data = await response.json();
                        if (data.error) {
                            errorMsg = data.error;
                        } else if (data.detail) {
                            errorMsg = data.detail;
                        } else if (data.otp_code && Array.isArray(data.otp_code)) {
                            errorMsg = data.otp_code[0];
                        } else if (data.session_id && Array.isArray(data.session_id)) {
                            errorMsg = data.session_id[0];
                        } else if (typeof data === 'object') {
                            const errors = Object.entries(data).map(([key, value]) => {
                                if (Array.isArray(value)) {
                                    return `${key}: ${value.join(', ')}`;
                                }
                                return `${key}: ${value}`;
                            }).join('; ');
                            if (errors) errorMsg = errors;
                        }
                    } catch (e) {
                        errorMsg = `Failed to mark attendance (Status: ${response.status})`;
                    }

                    showAlert('alertContainer', errorMsg, 'danger');

                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Mark Attendance';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('alertContainer', 'An error occurred. Please try again.', 'danger');

                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Mark Attendance';
            }
        });

        // Auto-format OTP input
        document.getElementById('otpCode').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('logoutBtn').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        document.addEventListener('DOMContentLoaded', loadSessions);
    </script>
</body>

</html>
