<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students - Smart Attendance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="faculty-dashboard.html">
                <i class="bi bi-calendar-check me-2"></i>Smart Attendance
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="faculty-dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <div class="row mb-4">
                <div class="col-auto">
                    <a href="faculty-dashboard.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back
                    </a>
                </div>
                <div class="col">
                    <h2 class="fw-bold mb-0">Registered Students</h2>
                    <p class="text-muted">List of all students registered by you</p>
                </div>
                <div class="col-auto">
                    <a href="register-student.html" class="btn btn-primary">
                        <i class="bi bi-person-plus me-2"></i>Register New Student
                    </a>
                </div>
            </div>

            <div class="card fade-in">
                <div class="card-body">
                    <div id="studentsContainer">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/auth.js"></script>
    <script>
        async function loadStudents() {
            try {
                const response = await apiRequest('/auth/faculty/students/');
                const students = await response.json();

                const container = document.getElementById('studentsContainer');

                if (students.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-people" style="font-size: 3rem;"></i>
                            <p class="mt-3">No students registered yet.</p>
                        </div>
                    `;
                    return;
                }

                const table = `
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Photo</th>
                                    <th>Roll Number</th>
                                    <th>Full Name</th>
                                    <th>Username</th>
                                    <th>Registered On</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${students.map(student => `
                                    <tr>
                                        <td>
                                            ${student.photo ?
                        `<img src="${student.photo}" class="rounded-circle" width="40" height="40" style="object-fit: cover;">` :
                        `<div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white" style="width: 40px; height: 40px;">
                                                    <i class="bi bi-person"></i>
                                                </div>`
                    }
                                        </td>
                                        <td><span class="badge bg-light text-dark border">${student.roll_number}</span></td>
                                        <td class="fw-bold">${student.full_name}</td>
                                        <td>${student.username}</td>
                                        <td>${new Date(student.created_at).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                container.innerHTML = table;

            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('studentsContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>Failed to load students list.
                    </div>
                `;
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        document.addEventListener('DOMContentLoaded', loadStudents);
    </script>
</body>

</html>
